# CodeQL (code scanning) — gratis en repos públicos.
# Analiza el compilador seed (C). CodeQL no soporta Zig todavía, por eso solo
# c-cpp. El build es manual (make -C seed) porque autobuild no descubre el
# Makefile que vive en seed/.
name: codeql

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Semanal, lunes 04:17 UTC
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build (seed)
        run: make -C seed

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
