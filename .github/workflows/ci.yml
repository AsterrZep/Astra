name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seed:
    name: seed (C) — ASan/UBSan/LSan + suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the sanitizer variant first, then run the suite directly against
      # that binary: `make test` depends on $(TARGET) and would rebuild it with
      # default flags, silently dropping the sanitizers.
      - name: Build (ASan + UBSan + LSan)
        run: make debug
        working-directory: seed
      - name: Test suite (registry gate + VM + C backend)
        run: ./tests/run_tests.sh
        working-directory: seed
      # PRE_LLVM_AUDIT §1: every non-UI conformance case through the VM and
      # through --emit-c + gcc, stdout/stderr/rc byte-identical. run_tests.sh
      # only round-trips tests/codegen/, so divergences outside it (like the
      # call-depth guard bug of §1.1) were invisible before this sweep.
      - name: Differential sweep (VM vs --emit-c + gcc)
        run: ./tests/sweep_emit_c.sh
        working-directory: seed
      - name: Release build compiles clean
        run: make release
        working-directory: seed
      # libFuzzer harness (PHASE1 §4bis#23): build it, then execute every
      # test program through the instrumented binary exactly once (-runs=0).
      # This is a deterministic replay, not a campaign — seconds, and it
      # fails the job on any sanitizer hit or harness crash while feeding
      # the whole suite through the fuzzed pipeline.
      - name: Fuzz harness (clang + libFuzzer) + corpus replay
        run: |
          make fuzz
          mkdir -p build/fuzz/corpus build/fuzz/work
          find tests -name '*.astra' -exec cp -f {} build/fuzz/corpus/ \;
          # Triage-fixed memory findings live in fuzz/regressions/ byte-exact
          # (AGENTS.md): replay them too — they are not valid programs, so
          # they cannot ride along under tests/.
          find fuzz/regressions -type f -exec cp -f {} build/fuzz/corpus/ \;
          ./build/fuzz/astra-fuzz build/fuzz/work build/fuzz/corpus -runs=0
        working-directory: seed

  zig:
    name: zig (Phase 2) — zig build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build
        working-directory: zig
      # Unit tests + the seed conformance suite compiled and executed in the
      # Zig VM. conformance.zig hard-fails when seed/tests/conformance is
      # missing, so a sparse checkout cannot go green.
      - name: Unit tests + seed conformance
        run: zig build test --summary all
        working-directory: zig

  # Dump parity (PHASE2 §4 #6): --dump-tokens and --dump-ast must be
  # byte-for-byte identical between the seed reference and astra-zig on
  # every conformance/codegen file plus the parse-only probes.
  parity:
    name: dump parity (seed <-> zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build seed (reference)
        run: make debug
        working-directory: seed
      - name: Build zig
        run: zig build
        working-directory: zig
      - name: Byte-for-byte dump comparison
        run: ./zig/tests/dump_parity.sh
      # PRE_LLVM_AUDIT §1: both compilers must reject every ui/ case with the
      # same FIRST diagnostic line (`file:line:col: error: msg`). Accepted
      # divergences live in the script's KNOWN_FIRST_LINE list (§1.7).
      - name: ui diagnostic messages (seed <-> zig)
        run: ./zig/tests/ui_message_parity.sh

  # LLVM backend (LLVM_BACKEND_PLAN.md §6 M0.4, §7): the opt-in -Dllvm route
  # must produce byte-identical stdout/stderr/exit-code to the zig VM for
  # every in-scope case (--emit-obj -> link runtime -> run; M2.e replaced the
  # llc subprocess with TargetMachineEmitToFile).
  # `-Dllvm` is opt-in, so the seed/zig/parity jobs above are untouched; this
  # is the only job that installs LLVM. LLVM 19 is pinned for reproducibility;
  # the apt.llvm.org install is the one piece the plan flags "[a verificar]".
  llvm:
    name: llvm (LLVM 19) — ruta --emit-obj sobre la suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # apt.llvm.org pins LLVM 19 regardless of the distro's own packages.
      # llvm.sh installs the tools (llc-19, opt-19); llvm-19-dev provides
      # llvm-config-19 (build.zig discovery) and the libLLVM-19 shared library
      # the compiler links against.
      - name: Install LLVM 19 (apt.llvm.org, pinned)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo DEBIAN_FRONTEND=noninteractive ./llvm.sh 19
          # llvm-19-tools aporta FileCheck-19 (shapes de IR, M3).
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y llvm-19-dev llvm-19-tools
      - name: Build zig with the LLVM backend
        run: zig build -Dllvm
        working-directory: zig
      - name: LLVM-route parity (VM <-> --emit-obj -> link)
        run: ./zig/tests/llvm_parity.sh
      # M4: el mismo gate con el pipeline del new PM (default<O2> + licm /
      # simple-loop-unswitch / irce). El optimizador no puede cambiar la
      # semántica observable: stdout, stderr y exit siguen byte a byte.
      - name: LLVM-route parity (optimized, -O2)
        run: ASTRA_LLVM_OPT=2 ./zig/tests/llvm_parity.sh
      # M6.a: el mismo gate de paridad pero por la ruta LLJIT in-process
      # (--jit), sin objeto ni enlace. Corre en el propio proceso, así que
      # valida que ejecutar en memoria reproduce la VM byte a byte.
      - name: LLVM-route JIT parity (VM <-> --jit, in-process)
        run: ./zig/tests/llvm_jit.sh
      - name: LLVM-route JIT parity (optimized, -O2)
        run: ASTRA_LLVM_OPT=2 ./zig/tests/llvm_jit.sh
      - name: IR shape checks (FileCheck)
        run: ./zig/tests/llvm_filecheck.sh
      # M4.c: DWARF (`--debug-info`). El script degrada a readelf (secciones
      # .debug_line/.debug_info) cuando lldb no está instalado — CI no lleva
      # lldb, así que aquí corre la ruta de secciones; el breakpoint por
      # línea Astra se verifica localmente con lldb (llvm_dwarf_test.sh).
      - name: DWARF debug info (sections)
        run: ./zig/tests/llvm_dwarf_test.sh
      # M4.d: ASan sobre los artefactos (IR instrumentado, enlace forzado con
      # -fsanitize=address, control negativo y la suite completa bajo ASan a
      # -O0 y -O2). M4.e añadió un paso final de LSan (detect_leaks=1) sobre
      # `leaks.astra`: el código generado ahora libera por refcount, así que
      # las fugas SÍ son objetivo del gate.
      - name: Sanitizers (ASan over the artifacts)
        run: ./zig/tests/llvm_sanitize.sh
      # Differential fuzz (M3): generated programs through the zig VM and the
      # LLVM route, byte-identical stdout/stderr/exit code. The seed routes
      # self-skip here (no seed build in this job); they run locally and in
      # the seed job's sweep. Fixed seed so a failure is reproducible.
      - name: Differential fuzz (VM <-> LLVM)
        run: ./zig/tests/llvm_fuzz.sh -n 20 -s 1

  # M5 cross-compilation gate (LLVM_BACKEND_PLAN.md §6 M5): the same suite
  # compiled for aarch64-linux-gnu (`--target`), linked with the cross
  # toolchain, and cross-run under qemu-user; stdout/stderr/exit must match the
  # native zig VM byte-for-byte. This is the "cross-run en CI" the milestone is
  # gated on — a real foreign-target ABI/codegen check, not just an object
  # sniff. Blocking: the cross-run is deterministic under qemu-user.
  llvm-cross:
    name: llvm-cross (aarch64) — cross-run bajo qemu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install LLVM 19 (apt.llvm.org, pinned)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo DEBIAN_FRONTEND=noninteractive ./llvm.sh 19
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y llvm-19-dev
      # Cross toolchain (aarch64-linux-gnu-gcc links the foreign object with
      # the runtime TU) and qemu-user-static (runs the aarch64 binary on the
      # x86-64 runner via binfmt).
      - name: Install cross toolchain + qemu
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
      - name: Build zig with the LLVM backend
        run: zig build -Dllvm
        working-directory: zig
      - name: Cross-route parity (VM <-> --emit-obj --target=aarch64 -> qemu)
        run: ./zig/tests/llvm_cross.sh

  # M5b gate wasm32-wasi (LLVM_BACKEND_PLAN.md §6, §4.4): la misma suite
  # compilada para wasm32-wasi (--target), enlazada con wasm-ld + wasi-libc
  # (crt1), y ejecutada bajo el WASI de Node; stdout/stderr/exit deben
  # coincidir byte a byte con la zig VM nativa. Verificado también contra el
  # sysroot exacto de Ubuntu noble (wasi-libc git20230113: su setjmp.h no
  # exige EH y el TU del runtime no emite setjmp/longjmp, sólo crt1 + libc).
  # El TU del runtime se compila con -mllvm -wasm-enable-sjlj (los wasi-libc
  # modernos #error-en setjmp.h sin EH), así que el motor necesita Node >= 22
  # (V8 con Exception Handling); setup-node fija 24, el mismo con que se
  # verificó localmente.
  llvm-wasm:
    name: llvm-wasm (wasm32-wasi) — suite bajo Node WASI
    runs-on: ubuntu-latest
    env:
      ASTRA_WASM_CLANG: clang-19
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install LLVM 19 (apt.llvm.org, pinned)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo DEBIAN_FRONTEND=noninteractive ./llvm.sh 19
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y llvm-19-dev
      # clang-19 compila el TU del runtime para wasm32-wasi; lld-19 aporta
      # wasm-ld-19 (enlace). El sysroot WASI se descarga en vez de instalar
      # el paquete wasi-libc de Ubuntu: noble (git20230113) se empaquetó sin
      # <setjmp.h> y es anterior al setjmp EH de wasi-libc, y el TU del
      # runtime necesita el tipo jmp_buf (codegen_runtime.h lo incluye).
      # El gate pasa include/<triple> con -I explícito (cualquier clang vale),
      # así que basta el sysroot — 31 MB, pinado a la release wasi-sdk-23.
      - name: Install clang/lld 19 + WASI sysroot
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clang-19 lld-19
          curl -fsSL -o "$RUNNER_TEMP/wasi-sysroot.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-23/wasi-sysroot-23.0.tar.gz
          mkdir -p "$RUNNER_TEMP/wasi-sysroot"
          tar xzf "$RUNNER_TEMP/wasi-sysroot.tar.gz" -C "$RUNNER_TEMP/wasi-sysroot" --strip-components=1
          echo "ASTRA_WASI_SYSROOT=$RUNNER_TEMP/wasi-sysroot/lib/wasm32-wasi" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build zig with the LLVM backend
        run: zig build -Dllvm
        working-directory: zig
      - name: wasm parity (VM <-> --emit-obj --target=wasm32-wasi -> Node WASI)
        run: ./zig/tests/llvm_wasm.sh
      # M4: el mismo gate con el pipeline del new PM (default<O2>), igual que
      # los gates nativo y cross.
      - name: wasm parity (optimized, -O2)
        run: ASTRA_LLVM_OPT=2 ./zig/tests/llvm_wasm.sh

  # Canario no bloqueante (LLVM_BACKEND_PLAN.md §2/§7): la misma ruta con el
  # LLVM stable más reciente de apt.llvm.org (llvm.sh sin argumentos usa su
  # CURRENT_LLVM_STABLE). Adelanta el churn de la C API hacia el rango
  # soportado (19..23) sin bloquear merges: el gate real es el job `llvm`,
  # pinado a 19, que es el suelo del rango.
  llvm-canario:
    name: llvm (latest) — canario no bloqueante
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install latest LLVM (apt.llvm.org default)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          v=$(grep -oE 'CURRENT_LLVM_STABLE=[0-9]+' llvm.sh | cut -d= -f2)
          sudo DEBIAN_FRONTEND=noninteractive ./llvm.sh "$v"
          # -dev aporta llvm-config-NN (descubrimiento de build.zig) y
          # -tools aporta FileCheck-NN.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "llvm-$v-dev" "llvm-$v-tools"
      - name: Build zig with the LLVM backend
        run: zig build -Dllvm
        working-directory: zig
      - name: LLVM-route parity (VM <-> --emit-obj -> link)
        run: ./zig/tests/llvm_parity.sh
      - name: IR shape checks (FileCheck)
        run: ./zig/tests/llvm_filecheck.sh
