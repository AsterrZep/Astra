name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seed:
    name: seed (C) — ASan/UBSan/LSan + suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the sanitizer variant first, then run the suite directly against
      # that binary: `make test` depends on $(TARGET) and would rebuild it with
      # default flags, silently dropping the sanitizers.
      - name: Build (ASan + UBSan + LSan)
        run: make debug
        working-directory: seed
      - name: Test suite (registry gate + VM + C backend)
        run: ./tests/run_tests.sh
        working-directory: seed
      # PRE_LLVM_AUDIT §1: every non-UI conformance case through the VM and
      # through --emit-c + gcc, stdout/stderr/rc byte-identical. run_tests.sh
      # only round-trips tests/codegen/, so divergences outside it (like the
      # call-depth guard bug of §1.1) were invisible before this sweep.
      - name: Differential sweep (VM vs --emit-c + gcc)
        run: ./tests/sweep_emit_c.sh
        working-directory: seed
      - name: Release build compiles clean
        run: make release
        working-directory: seed
      # libFuzzer harness (PHASE1 §4bis#23): build it, then execute every
      # test program through the instrumented binary exactly once (-runs=0).
      # This is a deterministic replay, not a campaign — seconds, and it
      # fails the job on any sanitizer hit or harness crash while feeding
      # the whole suite through the fuzzed pipeline.
      - name: Fuzz harness (clang + libFuzzer) + corpus replay
        run: |
          make fuzz
          mkdir -p build/fuzz/corpus build/fuzz/work
          find tests -name '*.astra' -exec cp -f {} build/fuzz/corpus/ \;
          # Triage-fixed memory findings live in fuzz/regressions/ byte-exact
          # (AGENTS.md): replay them too — they are not valid programs, so
          # they cannot ride along under tests/.
          find fuzz/regressions -type f -exec cp -f {} build/fuzz/corpus/ \;
          ./build/fuzz/astra-fuzz build/fuzz/work build/fuzz/corpus -runs=0
        working-directory: seed

  zig:
    name: zig (Phase 2) — zig build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build
        working-directory: zig
      # Unit tests + the seed conformance suite compiled and executed in the
      # Zig VM. conformance.zig hard-fails when seed/tests/conformance is
      # missing, so a sparse checkout cannot go green.
      - name: Unit tests + seed conformance
        run: zig build test --summary all
        working-directory: zig

  # Dump parity (PHASE2 §4 #6): --dump-tokens and --dump-ast must be
  # byte-for-byte identical between the seed reference and astra-zig on
  # every conformance/codegen file plus the parse-only probes.
  parity:
    name: dump parity (seed <-> zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build seed (reference)
        run: make debug
        working-directory: seed
      - name: Build zig
        run: zig build
        working-directory: zig
      - name: Byte-for-byte dump comparison
        run: ./zig/tests/dump_parity.sh
      # PRE_LLVM_AUDIT §1: both compilers must reject every ui/ case with the
      # same FIRST diagnostic line (`file:line:col: error: msg`). Accepted
      # divergences live in the script's KNOWN_FIRST_LINE list (§1.7).
      - name: ui diagnostic messages (seed <-> zig)
        run: ./zig/tests/ui_message_parity.sh

  # LLVM backend (LLVM_BACKEND_PLAN.md §6 M0.4, §7): the opt-in -Dllvm route
  # (M0 subset) must produce byte-identical stdout/stderr/exit-code to the zig
  # VM for every in-scope case (--emit-llvm -> llc -> link runtime -> run).
  # `-Dllvm` is opt-in, so the seed/zig/parity jobs above are untouched; this
  # is the only job that installs LLVM. LLVM 19 is pinned for reproducibility;
  # the apt.llvm.org install is the one piece the plan flags "[a verificar]".
  llvm:
    name: llvm (LLVM 19) — ruta --emit-llvm sobre la suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # apt.llvm.org pins LLVM 19 regardless of the distro's own packages.
      # llvm.sh installs the tools (llc-19, opt-19); llvm-19-dev provides
      # llvm-config-19 (build.zig discovery) and the libLLVM-19 shared library
      # the compiler links against.
      - name: Install LLVM 19 (apt.llvm.org, pinned)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo DEBIAN_FRONTEND=noninteractive ./llvm.sh 19
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y llvm-19-dev
      - name: Build zig with the LLVM backend
        run: zig build -Dllvm
        working-directory: zig
      - name: LLVM-route parity (VM <-> --emit-llvm -> llc -> link)
        run: ./zig/tests/llvm_parity.sh
