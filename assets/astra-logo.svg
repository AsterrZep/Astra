<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Star symbol -->
  <g transform="translate(60, 60)">
    <polygon points="0,-35 8,-10 35,-10 13,7 22,32 0,17 -22,32 -13,7 -35,-10 -8,-10" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="8" fill="#a5b4fc"/>
  </g>
  <!-- Text -->
  <text x="110" y="75" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#textGrad)" letter-spacing="-2">Astra</text>
</svg>
